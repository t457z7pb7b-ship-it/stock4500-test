<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stock 4500 単語テスト｜苦手分類つき</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}

button.secondary{background:#edf1f6;color:#172033}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;color:#667085;font-size:14px}
.no{font-size:13px;color:#667085;margin-top:24px}.q{font-size:40px;font-weight:850;text-align:center;margin:25px 0;word-break:break-word}
.answer{font-size:22px;font-weight:750;text-align:center;margin:18px 0;padding:15px;border-radius:13px;background:#f4f6fa}
.stat{font-size:30px;font-weight:800;text-align:center;margin:15px 0}.wronglist{margin-top:18px}
.wrongitem{padding:10px 0;border-bottom:1px solid #eee}@media(max-width:560px){.grid{grid-template-columns:1fr}.q{font-size:34px}}

.dash-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dash-head h2{margin:0}
.smallBtn{width:auto;padding:8px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.statbox{background:#f4f6fa;border-radius:14px;padding:12px;text-align:center}
.statbox span{display:block;font-size:12px;color:#667085}.statbox b{font-size:24px}
.weak-title{font-weight:800;margin:8px 0}.weak-list{max-height:330px;overflow:auto}
.weak-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.wname{font-weight:800}.meta{font-size:12px;color:#667085;text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#fee2e2;color:#991b1b;font-size:11px;font-weight:800}

.small{font-size:13px;color:#667085;line-height:1.5}

</style>
</head>
<body>
<div class="app">
<div class="card">
<h1>Stock 4500 単語テスト</h1>
<div class="muted">Stock 4500の単語データを収録。苦手単語・正答率・間違えた回数を自動記録します。</div>
</div>


<section id="dashboard" class="card">
  <div class="dash-head">
    <h2>📊 苦手単語管理</h2>
    <button id="clearStats" class="secondary smallBtn">記録をリセット</button>
  </div>
  <div class="stats">
    <div class="statbox"><span>学習済み</span><b id="learnedCount">0</b></div>
    <div class="statbox"><span>苦手</span><b id="weakCount">0</b></div>
    <div class="statbox"><span>総回答</span><b id="totalAttempts">0</b></div>
  </div>
  <div class="weak-box">
    <div class="weak-title">苦手度ランキング</div>
    <div id="weakList" class="weak-list"><p class="small">まだ記録がありません。</p></div>
  </div>
  <div class="grid">
    <button id="weakTest">🔴 苦手単語だけテスト</button>
    <button id="wrongHistory" class="secondary">❌ 間違えた単語だけ</button>
  </div>
  <p class="small">記録はこのiPhoneのSafari内に保存されます。</p>
</section>
<section id="setup" class="card">
<div class="grid">
<div><label>出題方向</label><select id="direction"><option value="enja">英語 → 日本語</option><option value="jaen">日本語 → 英語</option></select></div>
<div><label>問題数</label><select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option><option value="all">範囲内すべて</option></select></div>
</div>
<div class="grid">
<div><label>開始No.</label><input id="from" type="number" min="1" max="2155" value="1"></div>
<div><label>終了No.</label><input id="to" type="number" min="1" max="2155" value="2155"></div>
</div>
<button id="start">テスト開始</button>
</section>

<section id="test" class="card hidden">
<div class="top"><span id="prog"></span><span id="score"></span></div>
<div class="no" id="no"></div><div class="q" id="q"></div>
<input id="user" placeholder="答えを入力（採点は自己判定）" autocomplete="off">
<button id="show">答えを見る</button>
<div id="panel" class="hidden">
<div class="answer" id="ans"></div>
<button id="yes">○ 正解</button><button id="noBtn" class="secondary">× 不正解</button>
</div>
</section>

<section id="finish" class="card hidden">
<h2>テスト終了</h2><div class="stat" id="result"></div>
<button id="wrongOnly">間違えた単語だけ再テスト</button>
<button id="again" class="secondary">同じ条件でもう一度</button>
<button id="back" class="secondary">設定へ戻る</button>
<div id="wrongList" class="wronglist"></div>
</section>

<div class="card muted">収録：Stock 4500のNo.1〜2155。単語データは元のテストページに収録されている内容を使用しています。</div>
</div>

const STORAGE_KEY='stock4500_word_stats_v1';
let quiz=[],i=0,score=0,wrong=[],settings=null,stats=loadStats();

const $=id=>document.getElementById(id);

function loadStats(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')||{};}
  catch(e){return {};}
}
function saveStats(){localStorage.setItem(STORAGE_KEY,JSON.stringify(stats));}
function getStat(no){
  if(!stats[no]) stats[no]={attempts:0,correct:0,wrong:0};
  return stats[no];
}
function accuracy(s){return s.attempts?Math.round(s.correct/s.attempts*100):0;}
function isWeak(s){return s && s.attempts>0 && (s.wrong>=2 || accuracy(s)<70);}
function recordAnswer(w,ok){
  const s=getStat(w.no);
  s.attempts++;
  if(ok) s.correct++; else s.wrong++;
  saveStats();
}
function shuffle(a){
  const x=[...a];
  for(let j=x.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[x[j],x[k]]=[x[k],x[j]];}
  return x;
}
function updateDashboard(){
  const entries=Object.entries(stats).filter(([,s])=>s.attempts>0);
  const ranked=entries.map(([no,s])=>({no:+no,s})).sort((a,b)=>{
    const aw=a.s.wrong/(a.s.attempts||1), bw=b.s.wrong/(b.s.attempts||1);
    return (bw-aw)||(b.s.wrong-a.s.wrong)||(a.s.attempts-b.s.attempts);
  });
  $('learnedCount').textContent=entries.length;
  $('weakCount').textContent=ranked.filter(x=>isWeak(x.s)).length;
  $('totalAttempts').textContent=entries.reduce((n,x)=>n+x.s.attempts,0);

  const top=ranked.filter(x=>isWeak(x.s)).slice(0,25);
  if(!top.length){
    $('weakList').innerHTML='<p class="small">まだ苦手単語はありません。テストを続けると自動で分類されます。</p>';
    return;
  }
  $('weakList').innerHTML=top.map(x=>{
    const w=WORDS.find(y=>y.no===x.no), a=accuracy(x.s);
    const cls=a<50?'badge':(a<80?'badge warnbadge':'badge goodbadge');
    return `<div class="weak-item">
      <div><span class="wname">No.${w.no} ${esc(w.en)}</span><br><span class="small">${esc(w.ja)}</span></div>
      <div class="meta"><span class="${cls}">${a}%</span><br>${x.s.wrong}回ミス / ${x.s.attempts}回回答</div>
    </div>`;
  }).join('');
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function startWithPool(pool, condition){
  if(!pool.length){alert('対象の単語がありません。まず通常のテストをしてください。');return;}
  const n=$('count').value==='all'?pool.length:Math.min(+$('count').value,pool.length);
  quiz=shuffle(pool).slice(0,n);i=0;score=0;wrong=[];
  settings=condition||null;
  $('setup').classList.add('hidden');$('dashboard').classList.add('hidden');
  $('finish').classList.add('hidden');$('test').classList.remove('hidden');showQ();
}
$('start').onclick=()=>{
  const a=+$('from').value,b=+$('to').value;
  if(a<1||b<a||b>WORDS.length){alert('範囲を確認してください。');return;}
  const pool=WORDS.filter(x=>x.no>=a&&x.no<=b);
  startWithPool(pool,{a,b});
};
function showQ(){
  const w=quiz[i],jaen=$('direction').value==='jaen';
  $('prog').textContent=`${i+1} / ${quiz.length}`;
  $('score').textContent=`正解 ${score}`;
  $('no').textContent=`No.${w.no}`;
  $('q').textContent=jaen?w.ja:w.en;
  $('user').value='';
  $('user').style.display='block';
  $('show').style.display='block';
  $('panel').classList.add('hidden');
  $('user').focus();
}
$('show').onclick=()=>{
  const w=quiz[i],jaen=$('direction').value==='jaen';
  $('ans').textContent=jaen?w.en:w.ja;
  $('panel').classList.remove('hidden');$('show').style.display='none';$('user').style.display='none';
};
function mark(ok){
  const w=quiz[i];
  recordAnswer(w,ok);
  if(ok)score++;else wrong.push(w);
  i++;
  i<quiz.length?showQ():finish();
}
$('yes').onclick=()=>mark(true);
$('noBtn').onclick=()=>mark(false);

function finish(){
  $('test').classList.add('hidden');$('finish').classList.remove('hidden');
  $('result').textContent=`${score} / ${quiz.length}（${Math.round(score/quiz.length*100)}%）`;
  $('wrongOnly').classList.toggle('hidden',!wrong.length);
  $('wrongList').innerHTML=wrong.length
    ?('<b>今回の不正解</b>'+wrong.map(w=>{
      const s=getStat(w.no);
      return `<div class="wrongitem">No.${w.no}　${esc(w.en)} — ${esc(w.ja)}<br><span class="small">累計：${s.wrong}回ミス / ${s.attempts}回回答（正答率 ${accuracy(s)}%）</span></div>`;
    }).join(''))
    :'<b>今回の不正解</b><div class="wrongitem">なし。全問正解です！</div>';
  updateDashboard();
}
$('wrongOnly').onclick=()=>{
  startWithPool(wrong,null);
};
$('again').onclick=()=>{
  const p=WORDS.filter(x=>x.no>=settings.a&&x.no<=settings.b);
  startWithPool(p,settings);
};
$('back').onclick=()=>{
  $('finish').classList.add('hidden');$('dashboard').classList.remove('hidden');$('setup').classList.remove('hidden');updateDashboard();
};
$('weakTest').onclick=()=>{
  startWithPool(WORDS.filter(w=>isWeak(stats[w.no])),null);
};
$('wrongHistory').onclick=()=>{
  startWithPool(WORDS.filter(w=>stats[w.no]&&stats[w.no].wrong>0),null);
};
$('clearStats').onclick=()=>{
  if(confirm('これまでのStock 4500の成績記録をすべて消しますか？')){
    stats={};saveStats();updateDashboard();
  }
};
updateDashboard();
</script>
